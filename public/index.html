<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Opal Clip — 4K Video Clipper</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0b0f17;--card:#121926;--card2:#0e1520;--line:#1f2a3c;
    --txt:#e8eef7;--mut:#8494ab;--acc:#22d3ee;--acc2:#a78bfa;--ok:#34d399;--err:#f87171;
  }
  html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;min-height:100vh}
  body{background:radial-gradient(1200px 500px at 50% -10%,#13233a 0%,var(--bg) 60%);
    display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px}
  .wrap{width:100%;max-width:560px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  h1{font-size:20px;font-weight:700;letter-spacing:.3px}
  h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:12px;color:var(--mut);margin-top:1px}
  .dot{width:8px;height:8px;border-radius:50%;background:#556;flex-shrink:0}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.25)}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 6px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  input[type=text],input[type=url],select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:13px 14px;font-size:15px;outline:none;transition:border .15s}
  input:focus,select:focus{border-color:var(--acc)}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  button{border:none;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s,opacity .15s}
  button:active{filter:brightness(1.15)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-p{background:linear-gradient(135deg,var(--acc),#4f9cf9);color:#04121a;width:100%;margin-top:14px}
  .btn-s{background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:13px;padding:9px 12px}
  .btn-g{background:linear-gradient(135deg,var(--ok),#10b981);color:#03211a;width:100%;margin-top:12px}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick button{padding:7px 10px;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:8px}
  .quick button.on{color:var(--acc);border-color:var(--acc)}
  .meta{display:flex;gap:12px;align-items:center}
  .thumb{width:112px;height:63px;border-radius:9px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid var(--line)}
  .title{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .info{font-size:12px;color:var(--mut);margin-top:4px}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;margin-right:5px;letter-spacing:.4px}
  .b4k{background:rgba(212,175,55,.15);color:#fbbf24;border:1px solid rgba(212,175,55,.3)}
  .bdur{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
  .bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s ease}
  .ptext{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
  .phase{font-weight:600;color:var(--acc)}
  video{width:100%;border-radius:12px;background:#000;margin-bottom:10px;max-height:340px}
  .res{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .res .badge{font-size:11px;padding:5px 9px}
  .bok{background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
  .msg{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:14px;display:none}
  .msg.err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:#fca5a5;display:block}
  .msg.info{background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.2);color:#a5f3fc;display:block}
  .hide{display:none!important}
  footer{text-align:center;font-size:11px;color:#556a85;margin-top:8px;line-height:1.7}
  a{color:var(--acc);text-decoration:none}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .preset{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .preset button{padding:8px 4px;font-size:11.5px;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:8px}
  .preset button b{display:block;font-size:13px;color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✂️</div>
    <div style="flex:1">
      <h1>Opal <span>Clip</span></h1>
      <div class="sub">YouTube clipper · up to 4K · original quality</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px"><div class="dot" id="dot"></div></div>
  </header>

  <div class="msg" id="msg"></div>

  <div class="card" id="cardUrl">
    <label>Video URL</label>
    <div class="row">
      <input type="url" id="url" placeholder="https://youtube.com/watch?v=..." autocapitalize="off" autocomplete="off" spellcheck="false">
      <button class="btn-s" id="paste" style="flex:0 0 auto">Paste</button>
    </div>
    <button class="btn-p" id="btnAnalyze">Analyze</button>
  </div>

  <div class="card hide" id="cardVideo">
    <div class="meta">
      <img class="thumb" id="thumb" alt="">
      <div>
        <div class="title" id="vtitle"></div>
        <div class="info" id="vinfo"></div>
        <div style="margin-top:6px"><span class="badge b4k hide" id="b4k">4K</span><span class="badge bdur" id="vdur"></span></div>
      </div>
    </div>
    <label>Quality</label>
    <select id="quality">
      <option value="auto" selected>Auto — best available (original)</option>
    </select>
    <div class="row" style="margin-top:2px">
      <div><label>Start</label><input type="text" id="start" placeholder="0:00" inputmode="numeric"></div>
      <div><label>End</label><input type="text" id="end" placeholder="0:30" inputmode="numeric"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="preset" id="preset"></div>
    <button class="btn-p" id="btnClip">✂️ Create Clip</button>
    <div class="info" id="capinfo" style="text-align:center;margin-top:10px"></div>
  </div>

  <div class="card hide" id="cardProg">
    <div class="ptext"><span class="phase" id="phase">queued</span><span id="pct">0%</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="ptext"><span id="phint">Waiting for a free slot…</span><span id="eta"></span></div>
    <button class="btn-s" id="btnCancel" style="margin-top:12px">Cancel</button>
  </div>

  <div class="card hide" id="cardDone">
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="res" id="resbadges"></div>
    <a id="dl" download><button class="btn-g">⬇️ Download clip</button></a>
    <button class="btn-s" id="btnAgain" style="margin-top:10px;width:100%">✂️ Clip another part</button>
  </div>

  <footer>
    <b>Opal Clip Cloud</b> · stream-copy (no re-encode) · works with 1000+ sites<br>
    Runs on a free serverless-ish worker — clips auto-delete after ~20 min
  </footer>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const msg=(t,cls)=>{const m=$('msg');m.className='msg '+(cls||'err');m.innerHTML=t};
const clearMsg=()=>$('msg').className='msg';
const apiKey=localStorage.getItem('opal_key')||'';
const headers={'Content-Type':'application/json',...(apiKey?{'X-Api-Key':apiKey}:{})};
let caps={maxClipSeconds:600},videoInfo=null,pollTimer=null,curJob=null;

function fmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function parseT(v){v=String(v||'').trim();if(!v)return NaN;
  if(/^\d+(\.\d+)?$/.test(v))return+parseFloat(v);
  const p=v.split(':').map(Number);if(p.some(isNaN)||p.length>3)return NaN;
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:NaN}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB'}

async function api(path,opts){const r=await fetch(path,{...opts,headers});
  const j=await r.json().catch(()=>({error:'Bad server response'}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}

async function health(){try{const h=await(await fetch('/healthz')).json();
  $('dot').classList.toggle('on',h.ok);
  if(h.warp&&h.warp.enabled)document.title='Opal Clip — 4K Clipper'+(h.warp.active?' 🛡':'');
}catch{$('dot').classList.remove('on')}}
health();setInterval(health,30000);

(async()=>{try{caps=await api('/api/capabilities');
  if(caps.authRequired&&!apiKey){msg('🔑 This server is protected. Enter your API key: <input id="keyin" style="margin-top:8px;width:100%;padding:10px;border-radius:9px;border:1px solid #334;background:#0e1520;color:#fff" placeholder="paste key"><button class="btn-s" style="margin-top:8px" onclick="localStorage.setItem(\'opal_key\',document.getElementById(\'keyin\').value);location.reload()">Save</button>','info')}
  $('capinfo').textContent='Max clip length: '+Math.round(caps.maxClipSeconds/60)+' minutes';
}catch{}})();

$('url').value=localStorage.getItem('opal_url')||'';
$('paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();$('url').value=t.trim();$('url').dispatchEvent(new Event('input'))}catch{msg('Clipboard blocked — paste manually'}};
$('url').addEventListener('input',()=>localStorage.setItem('opal_url',$('url').value));
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnAnalyze').click()});

$('btnAnalyze').onclick=async()=>{
  clearMsg();const url=$('url').value.trim();
  if(!/^https?:\/\//i.test(url))return msg('Paste a valid video URL (https://…)');
  $('btnAnalyze').disabled=true;$('btnAnalyze').innerHTML='<span class="spin"></span>Analyzing…';
  try{
    const {jobId}=await api('/api/analyze',{method:'POST',body:JSON.stringify({url})});
    const j=await poll(jobId,120000);
    videoInfo=j.result;
    $('vtitle').textContent=videoInfo.title;
    $('vinfo').textContent=(videoInfo.uploader?videoInfo.uploader+' · ':'')+videoInfo.heights.length+' qualities';
    $('vdur').textContent=fmt(videoInfo.duration||0);
    $('b4k').classList.toggle('hide',!videoInfo.max4k);
    $('thumb').src=videoInfo.thumbnail||'';
    const q=$('quality');q.innerHTML='<option value="auto">Auto — best available (original)</option>';
    const names={2160:'4K UHD',1440:'2K QHD',1080:'Full HD',720:'HD',480:'SD',360:'Low',240:'240p',144:'144p'};
    (videoInfo.heights||[]).forEach(h=>{const o=document.createElement('option');o.value=h;
      o.textContent=(names[h]||h+'p')+' — '+h+'p'+(h>=2160?' (max)':'');q.appendChild(o)});
    if(videoInfo.max4k)q.insertBefore(new Option('4K 2160p — original max','2160'),q.options[1]);
    $('cardVideo').classList.remove('hide');
    $('end').value=videoInfo.duration?fmt(Math.min(30,videoInfo.duration)):'0:30';
    buildQuick();buildPresets();
    $('cardVideo').scrollIntoView({behavior:'smooth'});
  }catch(e){msg('❌ '+esc(e.message))}
  $('btnAnalyze').disabled=false;$('btnAnalyze').textContent='Analyze';
};

function buildQuick(){const d=videoInfo.duration||0,el=$('quick');el.innerHTML='';
  const acts=[['Full video',0,d],['First 30s',0,Math.min(30,d)],['First 60s',0,Math.min(60,d)],['Last 30s',Math.max(0,d-30),d]];
  acts.filter(a=>a[2]-a[1]>=1).forEach(([n,s,e])=>{const b=document.createElement('button');
    b.textContent=n;b.onclick=()=>{$('start').value=fmt(s);$('end').value=fmt(e)};el.appendChild(b)})}
function buildPresets(){const el=$('preset');el.innerHTML='';
  const caps2=[[15,'15s'],[30,'30s'],[60,'1 min'],[180,'3 min']];
  caps2.forEach(([sec,n])=>{const b=document.createElement('button');
    b.innerHTML='<b>'+n+'</b>from start';b.onclick=()=>{const s=parseT($('start').value)||0;
      $('start').value=fmt(s);$('end').value=fmt(s+sec)};el.appendChild(b)})}

$('btnClip').onclick=async()=>{
  clearMsg();
  const url=$('url').value.trim(),start=parseT($('start').value),end=parseT($('end').value);
  if(isNaN(start)||isNaN(end))return msg('Start/End must look like 90 or 1:30');
  if(end<=start)return msg('End must be after start');
  if(end-start>caps.maxClipSeconds)return msg('Clip too long — max '+Math.round(caps.maxClipSeconds/60)+' min on this server');
  $('btnClip').disabled=true;
  try{
    const {jobId}=await api('/api/clip',{method:'POST',body:JSON.stringify({url,start,end,quality:$('quality').value,title:videoInfo?videoInfo.title:''})});
    $('cardProg').classList.remove('hide');$('cardDone').classList.add('hide');
    $('cardProg').scrollIntoView({behavior:'smooth'});
    const j=await poll(jobId,30*60*1000);
    showResult(j);
  }catch(e){msg('❌ '+esc(e.message))}
  $('btnClip').disabled=false;
};

function poll(jobId,timeoutMs){return new Promise((resolve,reject)=>{
  const t0=Date.now();
  (async function tick(){
    try{
      const j=await api('/api/job/'+jobId);
      curJob=jobId;
      if(j.type==='clip'){
        $('phase').textContent=j.phase||j.status;
        $('pct').textContent=Math.floor(j.progress)+'%';
        $('fill').style.width=j.progress+'%';
        $('eta').textContent=j.status==='queued'?'':'elapsed '+fmt((Date.now()-t0)/1000);
        $('phint').textContent=j.status==='queued'?'Waiting for a free slot…':'Downloading only the selected seconds — fast!';
      }
      if(j.status==='done')return resolve(j);
      if(j.status==='error'||j.status==='cancelled')return reject(new Error(j.error||('Job '+j.status)+(j.detail?' — '+j.detail[j.detail.length-1]:'')));
      if(Date.now()-t0>timeoutMs)return reject(new Error('Timed out waiting for the job'));
      pollTimer=setTimeout(tick,j.status==='queued'&&j.type==='analyze'?1500:1200);
    }catch(e){reject(e)}
  })()})}

$('btnCancel').onclick=async()=>{if(!curJob)return;try{await api('/api/job/'+curJob,{method:'DELETE'})}catch{}clearTimeout(pollTimer)};

function showResult(j){
  clearTimeout(pollTimer);
  $('cardProg').classList.add('hide');$('cardDone').classList.remove('hide');
  const r=j.result,v=r.video;
  $('player').src=r.file.url;
  $('dl').href=r.file.url+'?dl=1';
  $('dl').setAttribute('download',r.file.name);
  const badges=[['✓ '+(v.height?v.height+'p'+(v.height>=2160?' 4K':''):'video'),'bok'],
    [fmt(v.duration||0),'bdur'],[fmtSize(r.file.size),'bdur'],[v.codec? v.codec.toUpperCase():'','bdur'],[v.ext.toUpperCase(),'bdur']];
  $('resbadges').innerHTML=badges.filter(b=>b[0]).map(b=>'<span class="badge '+b[1]+'">'+esc(String(b[0]))+'</span>').join('');
  $('cardDone').scrollIntoView({behavior:'smooth'});
}

$('btnAgain').onclick=()=>{$('cardDone').classList.add('hide');$('cardVideo').scrollIntoView({behavior:'smooth'})};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
